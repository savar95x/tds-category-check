:root{
  color-scheme:light;
  --ground:#F5F6F8; --surface:#FFFFFF; --hover:#F3F4F7; --line:#E5E7EC; --line-2:#EFF0F3;
  --ink:#12161F; --muted:#626B7A;
  --ai:#8A5A06; --ai-mark:#FFE7A3; --ai-tint:#FFF7E3; --ai-line:#F3DB9B;
  --code:#0A7566; --code-tint:#E7F6F3; --code-line:#BDE5DD;
  --person:#6438DC; --person-tint:#F3EFFE; --person-line:#DACEFB;
  --bad:#C22F1C; --bad-tint:#FDEEEB; --bad-line:#F6CFC8;
  --sheet:#FFFFFF; --sheet-ink:#12161F; --sheet-muted:#626B7A; --sheet-line:#E8EAEE;
  --sans:"Geist Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --typed:var(--sans);
  --shadow:0 1px 2px rgba(18,22,31,.04),0 8px 24px -12px rgba(18,22,31,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--code);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--person);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.top{background:var(--surface);color:var(--ink);display:flex;align-items:center;gap:18px;padding:0 20px;min-height:56px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.brand{font-weight:650;font-size:15.5px;letter-spacing:-.015em}
.nav{display:flex;gap:2px;align-items:center}
.nav button{background:none;border:0;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current=page]{background:var(--hover);color:var(--ink);font-weight:600}
.spacer{flex:1}
.acting{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--hover);border-radius:9px;padding:3px}
.seg button{background:none;border:0;color:var(--muted);padding:4px 11px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--person);font-weight:600;box-shadow:0 1px 2px rgba(18,22,31,.10)}
.linkish{background:none;border:0;color:var(--muted);cursor:pointer;padding:5px 7px;font-size:13px;border-radius:7px}
.linkish:hover{background:var(--hover);color:var(--ink)}

/* Provenance strip */
.key{background:var(--surface);border-bottom:1px solid var(--line);padding:7px 20px;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.key strong{color:var(--ink);font-weight:550}
.who{display:inline-flex;align-items:center;gap:6px}
.who i{width:9px;height:9px;border-radius:50%;display:inline-block}
.who.ai i{background:#E9B23C}
.who.code i{background:var(--code)}
.who.person i{background:var(--person)}
.note{margin-left:auto}
@media (max-width:1100px){.note{margin-left:0;flex-basis:100%}}

/* Review layout */
@media (min-width:1001px){#app{height:100vh;display:flex;flex-direction:column}.layout,.page{flex:1;min-height:0}}
.layout{display:grid;grid-template-columns:392px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.list{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:16px 16px 0}
.list-head h1{font-size:17px;font-weight:650;letter-spacing:-.018em}
.list-head p{color:var(--muted);font-size:13px;margin-top:2px}
.progress{margin-top:12px;height:6px;background:var(--line-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--person);border-radius:99px;transition:width .25s}
.progress-text{font-size:12.5px;color:var(--muted);margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin:12px 0 8px;background:var(--hover);padding:3px;border-radius:9px}
.tabs button{flex:1 1 auto;background:none;border:0;padding:4px 5px;border-radius:7px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:12.5px;font-weight:500}
.tabs button b{font-weight:600;margin-left:1px}
.tabs button:not(:disabled):hover{color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(18,22,31,.10)}
.tabs button:disabled{cursor:default;opacity:.6}
.rows{overflow-y:auto;flex:1;min-height:0;padding:0 8px 8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:10px;cursor:pointer;border-radius:10px;margin-top:2px}
.row:not(:disabled):hover{background:var(--hover)}
.row[aria-current=true]{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
.row .v{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.row .a{text-align:right;font-weight:550}
.row .m{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{text-align:right;font-size:12.5px;color:var(--muted)}
.row .d.short{color:var(--bad);font-weight:550}

dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 24px 60px -20px rgba(18,22,31,.35)}

function sha256(str){

/* Stand-in reader for text the script doesn't cover: looks for fixed phrases, so it is far weaker than a real model. */
const LEXICON=[
 ["professional",/legal (opinion|advice|counsel)s?|retained legal counsel|chartered accountants?|statutory audit|tax advis\w+|architect\w*|interior decorat\w+|medical (advice|services)/i],
 ["technical",/technical services?|engineering support|technical support|call cent(re|er)/i],
 ["commission",/commission|brokerage/i],
 ["rent_building",/office rent|rent (for|of) (the )?(office|premises|building)|lease rent/i],
 ["rent_machinery",/(machinery|equipment) (hire|rent)|hire of (machinery|equipment)/i],
 ["contract",/housekeeping|catering|painting|repairs?|security guards?|manpower|transport|printing|labour/i]
];
function standIn(invoice,contract){
  const found=[];
  [["invoice",invoice],["contract",contract||""]].forEach(([src,t])=>LEXICON.forEach(([cat,re])=>{const m=t.match(re);if(m)found.push({cat,quote:m[0],src})}));
  const cats=[...new Set(found.map(f=>f.cat))];
  if(!cats.length)return {abstain:true,reason:"The stand-in reader found no phrase it recognises in this text.",facts:[]};
  if(cats.length>1)return {abstain:true,reason:"The text points to more than one category ("+cats.map(c=>CATS[c].label).join(", ")+"), so the stand-in reader won't choose.",facts:found.map(f=>["Phrase found",f.quote,f.src])};
  return {category:cats[0],reason:"The stand-in reader matched a fixed phrase. A real model would read the whole document.",facts:found.map(f=>["Phrase found",f.quote,f.src])};
}
/* The reader's only inputs: id and documents. The tag is withheld here on purpose. */
function readDocuments(id,invoice,contract,sampleContract,isScripted){
  if(isScripted&&SCRIPT[id]&&(!contract||contract===sampleContract))return Object.assign({model:MODEL_NAME},SCRIPT[id](!!contract));
  return Object.assign({model:"stand-in-phrases-v1"},standIn(invoice,contract));
}
const norm=s=>(s||"").replace(/\s+/g," ").trim().toLowerCase();

function process1(p){
  const {trigger,rs}=pickRuleset(p.credit,p.paid);
  const trace=[];
  trace.push(["code","Picked the Act",`The earlier of credit and payment is ${fmtDate(trigger)}, so ${rs.act} applies (rules ${rs.id}).`]);
  const read=readDocuments(p.id,p.text,p.contract||"",p.sampleContract,!p.custom);
  trace.push(["ai","Read the documents",read.abstain?"Found no reliable answer and abstained.":"Extracted facts with exact quotes, without seeing the current tag."]);
  const facts=(read.facts||[]).map(([label,quote,src])=>{
    const where=src==="contract"?(p.contract||""):p.text;
    return {label,quote,src:src||"invoice",found:norm(where).includes(norm(quote))};
  });
  const failed=facts.filter(f=>!f.found);
  trace.push(["code","Verified the quotes",facts.length?(failed.length?`${failed.length} of ${facts.length} quotes ${failed.length===1?"isn't":"aren't"} in the document, which counts as missing evidence.`:(facts.length===1?"The quote matches the document.":`All ${facts.length} quotes match the document.`)):"No quotes to check."]);
  trace.push(["ai",read.abstain?"Gave no suggestion":"Suggested a category",read.abstain?read.reason:`${CATS[read.category].label}. ${read.reason}`]);
  const whole=p.text+"\n"+(p.contract||"");
  const contested=state.contested.find(c=>norm(whole).includes(norm(c.term)));
  const usable=!read.abstain&&!failed.length;
  let queue,why;
  if(contested){queue="contested";why=`This payment contains "${contested.term}", a contested type. It goes to a CA whatever the model says.`}
  else if(!usable){queue="evidence";why=failed.length?"A quote from the reader isn't in the document, so the tool won't rely on its suggestion.":"The documents don't say what the work was. Attach the contract to continue."}
  else if(read.category===p.tag){queue="match";why="The suggestion, reached without seeing the tag, agrees with the tag."}
  else{queue="mismatch";why=`The tag says ${CATS[p.tag].label}. This document reads as ${CATS[read.category].label}.`}
  trace.push(["code","Compared and routed",why]);
  p.rs=rs;p.trigger=trigger;p.read=read;p.facts=facts;p.failed=failed;p.queue=queue;p.why=why;p.contestedHit=contested||null;p.trace=trace;
  p.suggest=usable?read.category:null;
  p.fingerprint=sha256(p.text+"\u0000"+(p.contract||""));
  return p;
}
function current(p){return calc(p.rs,p.tag,p)}

  const cat=p.decision?p.decision.cat:p.suggest;if(!cat||!p.rs)return 0;

}

function highlight(text,quotes){
  const ranges=[],low=text.toLowerCase();
  quotes.forEach(q=>{const i=low.indexOf(q.toLowerCase());if(i>=0)ranges.push([i,i+q.length])});
  ranges.sort((a,b)=>a[0]-b[0]);
  let out="",pos=0;
  ranges.forEach(([a,b])=>{if(a<pos)return;out+=esc(text.slice(pos,a))+"<mark>"+esc(text.slice(a,b))+"</mark>";pos=b});
  return out+esc(text.slice(pos));
}

function decide(p,type,cat,summary,stamp,reason){
  const a=PEOPLE[state.role];
  const f=calc(p.rs,cat,p);
  p.decision={type,cat,summary,stamp,reason:reason||"",actor:a.name,role:a.role,time:new Date().toISOString()};
  p.flag=false;p.err="";
  logEntry("Decision",p,{summary,reason,category:cat,ref:f.ref,rate:f.rate,tds:f.tds});
  state.fresh=p.id;
  toast(`Recorded: ${summary}`);
}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const calm=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
async function runReview(){
  if(state.running)return;
  state.running=true;
  const fast=calm();
  const P=state.payments;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const steps=fast?[4]:[0,1,2,3,4];
    for(const s of steps){state.runStep=s;state.runLine=`Checking ${p.vendor}`;if(s===4||i<2)render();if(!fast&&i<2)await delay(130)}
    process1(p);
    render();
    if(!fast)await delay(i<2?70:95);
  }
  let m=0;P.forEach(p=>{if(p.queue==="match"){if(m%3===0)p.sampled=true;m++}});
  state.running=false;state.ran=true;state.runStep=-1;state.runLine="";
  logEntry("Review run",null,{summary:`Checked ${P.length} payments: ${["mismatch","evidence","contested","match"].map(q=>P.filter(p=>p.queue===q).length+" "+QLABEL[q].toLowerCase()).join(", ")}.`});
  const first=P.find(p=>p.queue==="mismatch")||P[0];
  state.selected=first.id;
  if(innerWidth<=1000)state.open=false;else state.open=true;
  toast("Check finished. Review the flagged payments.");
  render();
}

    return [p.id,p.vendor,p.inv,p.amount,p.queue?QLABEL[p.queue]:"Not checked",c?c.ref:"",c?c.tds:"",p.decision?CATS[p.decision.cat].label:"",f?f.ref:"",f?f.tds:"",f?f.tds-c.tds:"",p.decision?p.decision.actor:"",p.decision?p.decision.reason:""].map(q).join(",")});

  }

    toast(hit.length?`${hit.length} ${hit.length===1?"decision":"decisions"} flagged for review`:"No decisions rely on this rule yet");render();return;
  }
  if(a==="add-term"){
    const t=state.newTerm.trim(),w=state.newWhy.trim();
    if(!t||!w){toast("Enter both a term and why it is contested");return}
    state.contested.push({term:t,why:w,src:null,by:PEOPLE[state.role].name});
    state.payments.filter(x=>x.queue&&!x.decision).forEach(process1);
    logEntry("Contested list changed",null,{summary:`Added "${t}". Undecided payments were routed again.`,reason:w});
    state.newTerm="";state.newWhy="";toast("Added to the list. Undecided payments were routed again.");render();return;
  }
  if(!p)return;
  p.err="";
  if(a==="sample-contract"){p.draftContract=p.sampleContract;render();return}
  if(a==="rerun"){
    if(!p.draftContract.trim()){p.err="Paste the contract text, or use the sample contract.";render();return}
    p.contract=p.draftContract;process1(p);
    logEntry("Contract attached",p,{summary:`Checked again with the contract: ${QLABEL[p.queue]}.`});
    if(p.queue==="evidence")p.err="The contract didn't settle it. Check that it says what the work was.";
    toast(`Checked again: ${QLABEL[p.queue]}`);render();return;
  }
  if(a==="accept"){
    if(!p.checked){p.err="Tick the box once you've checked the quoted facts.";render();return}
    const f=calc(p.rs,p.suggest,p);
    decide(p,"change",p.suggest,`Changed to ${CATS[p.suggest].label} (${f.ref})`,`CHANGED TO ${f.ref}`,p.reason.trim());render();return;
  }
  if(a==="keep"){
    if(!p.checked){p.err="Tick the box once you've checked the quoted facts.";render();return}
    if(!p.reason.trim()){p.err="Give a reason for keeping the tag. It goes in the record.";render();return}
    const c=current(p);
    decide(p,"keep",p.tag,`Kept ${CATS[p.tag].label} (${c.ref})`,`KEPT ${c.ref}`,p.reason.trim());render();return;
  }
  if(a==="confirm"){const c=current(p);decide(p,"confirm",p.tag,`Confirmed the match (${c.ref})`,"CONFIRMED",p.reason.trim());render();return}
  if(a==="disagree"){
    if(!p.reason.trim()){p.err="Say what looks wrong, so the CA can see it.";render();return}
    p.queue="contested";p.spotBack=true;p.why="A spot-check disagreed with this match, so it went to a CA.";p.contestedHit=p.contestedHit||null;
    p.trace.push(["code","Routed after spot-check",`${PEOPLE[state.role].name} disagreed: ${p.reason.trim()}`]);
    logEntry("Sent to CA",p,{summary:"Spot-check disagreed with the match.",reason:p.reason.trim()});
    toast("Sent to a CA");render();return;
  }
  if(a==="confirm-facts"){
    if(!p.checked){p.err="Tick the box once you've checked the quoted facts.";render();return}
    p.factsConfirmed=PEOPLE[state.role].name;logEntry("Facts confirmed",p,{summary:"Facts confirmed for the CA."});toast("Facts confirmed for the CA");render();return;
  }
  if(a==="ca-decide"){
    if(state.role!=="ca"){p.err="Only a CA can decide this.";render();return}
    if(!p.caCat){p.err="Choose a category.";render();return}
    if(!p.reason.trim()){p.err="Give a reason. It goes in the record.";render();return}
    const f=calc(p.rs,p.caCat,p);
    decide(p,"ca",p.caCat,`CA decided ${CATS[p.caCat].label} (${f.ref})`,`CA DECIDED ${f.ref}`,p.reason.trim());render();return;
  }
  if(a==="reopen"){
    logEntry("Reopened",p,{summary:`Reopened. Earlier decision stays in the log: ${p.decision.summary}.`});
    p.decision=null;p.flag=false;p.checked=false;p.reason="";toast("Reopened. The earlier decision stays in the log.");render();return;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.inputGlobal){state[t.dataset.inputGlobal]=t.value;return}
  if(!t.dataset.input)return;const p=sel();if(!p)return;
  p[t.dataset.input]=t.type==="checkbox"?t.checked:t.value;
  if(p.err&&t.type==="checkbox"){p.err=""}
});
window.__tds={get state(){return state},sha256,calc,RULESETS,verifyChain};
render();
</script>
